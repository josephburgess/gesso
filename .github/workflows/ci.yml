name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gesso
          POSTGRES_PASSWORD: gesso
          POSTGRES_DB: gesso
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      DEBUG: 'true'
      SECRET_KEY: ci
      DATABASE_URL: postgres://gesso:gesso@localhost:5432/gesso
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: make lint check test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      HOST: deploy@elisebeer.art
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy Compose and Caddy config
        run: scp -p compose.prod.yaml Caddyfile deploy/backup.sh "$HOST:/srv/gesso/"
      - name: Write .env
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          DEBUG: ${{ vars.DEBUG }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
          SECURE_SSL_REDIRECT: ${{ vars.SECURE_SSL_REDIRECT }}
          SECURE_HSTS_SECONDS: ${{ vars.SECURE_HSTS_SECONDS }}
          NOINDEX: ${{ vars.NOINDEX }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_STORAGE_BUCKET_NAME: ${{ vars.AWS_STORAGE_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_FRONTEND_DSN: ${{ vars.SENTRY_FRONTEND_DSN }}
          REDIS_URL: ${{ vars.REDIS_URL }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
        run: |
          keys="SITE_DOMAIN POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DEBUG SECRET_KEY ALLOWED_HOSTS CSRF_TRUSTED_ORIGINS
            SECURE_SSL_REDIRECT SECURE_HSTS_SECONDS NOINDEX DATABASE_URL AWS_STORAGE_BUCKET_NAME AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY DEFAULT_FROM_EMAIL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SENTRY_DSN SENTRY_FRONTEND_DSN
            REDIS_URL MAILGUN_API_KEY"
          for k in SECRET_KEY DATABASE_URL POSTGRES_PASSWORD; do
            test -n "${!k}" || { echo "::error::$k is not set in the production environment"; exit 1; }
          done
          for k in $keys; do
            case "${!k}" in *"'"*) echo "::error::$k contains a single quote"; exit 1 ;; esac
          done
          for k in $keys; do
            test -z "${!k}" || printf "%s='%s'\n" "$k" "${!k}"
          done > env
          ssh "$HOST" "cd /srv/gesso && umask 077 && cp -p .env .env.bak && cat > .env.new && mv .env.new .env" < env
          rm env
      - name: Pull, migrate and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh "$HOST" "cd /srv/gesso \
            && docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && docker compose -f compose.prod.yaml pull web \
            && docker compose -f compose.prod.yaml run --rm -T web python manage.py migrate --noinput \
            && docker compose -f compose.prod.yaml up -d \
            && docker logout ghcr.io \
            && docker image prune -f"
