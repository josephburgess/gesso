{% load django_vite %}<!doctype html>
<html lang="en-GB" data-theme="paper" data-type="{{ site_headings }}" data-motion="{{ site_motion|yesno:'on,off' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      try {
        if (localStorage.getItem('theme') === 'charcoal') document.documentElement.dataset.theme = 'charcoal';
      } catch (e) {}
    </script>
    <title inertia>{% if title %}{{ title }} · {% endif %}{{ site_name }}</title>
    <meta name="description" content="{{ description|default:site_description }}">
    {% if sentry_frontend_dsn %}
    <meta name="sentry-dsn" content="{{ sentry_frontend_dsn }}">
    <meta name="sentry-environment" content="{{ sentry_environment }}">
    {% endif %}
    {% if image %}<meta property="og:image" content="{{ image }}">{% endif %}
    {% if structured_data %}<script type="application/ld+json">{{ structured_data }}</script>{% endif %}
    {% vite_hmr_client %}
    {% vite_react_refresh %}
    {% vite_asset "frontend/app.tsx" %}
  </head>
  <body>
    {% block inertia %}{% endblock %}
  </body>
</html>
