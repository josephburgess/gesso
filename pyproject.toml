[project]
name = "gesso-v2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-environ>=0.14.0",
    "django-unfold>=0.108.0",
    "django-vite>=3.2.0",
    "inertia-django>=2.0.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "stripe>=15.6.1",
]

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "DJ", "RUF", "TID252"]
allowed-confusables = ["×"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/admin.py" = ["RUF012"]
"**/migrations/*" = ["RUF012"]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
