[project]
name = "gesso-v2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Django's declarative admin options are class-level config, not shared mutable state
"**/admin.py" = ["RUF012"]
