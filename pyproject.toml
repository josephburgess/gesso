[project]
name = "gesso-v2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-environ>=0.14.0",
    "django-vite>=3.2.0",
    "inertia-django>=2.0.0",
    "psycopg[binary]>=3.3.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# Django's declarative admin options are class-level config, not shared mutable state
"**/admin.py" = ["RUF012"]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
